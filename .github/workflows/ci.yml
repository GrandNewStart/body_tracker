name: CI / CD Pipeline

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Automated Quality & Unit Tests
  test:
    name: Run Analysis & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Formatting & Static Analysis
        run: flutter analyze

      - name: Run Test Suite
        run: flutter test

  # 2. Android Build (APK & App Bundle for Google Play)
  build_android:
    name: Build Android Release (AAB & APK)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android App Bundle (AAB for Google Play)
        env:
          ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
        run: |
          DART_DEFINES=""
          if [ -n "${{ secrets.ADMOB_ANDROID_REWARDED_AD_UNIT_ID }}" ]; then
            DART_DEFINES="--dart-define=ADMOB_ANDROID_REWARDED_AD_UNIT_ID=${{ secrets.ADMOB_ANDROID_REWARDED_AD_UNIT_ID }}"
          fi
          flutter build appbundle --release $DART_DEFINES

      - name: Build Android APK (for Direct Testing)
        env:
          ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
        run: |
          DART_DEFINES=""
          if [ -n "${{ secrets.ADMOB_ANDROID_REWARDED_AD_UNIT_ID }}" ]; then
            DART_DEFINES="--dart-define=ADMOB_ANDROID_REWARDED_AD_UNIT_ID=${{ secrets.ADMOB_ANDROID_REWARDED_AD_UNIT_ID }}"
          fi
          flutter build apk --release $DART_DEFINES

      - name: Upload Android AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
